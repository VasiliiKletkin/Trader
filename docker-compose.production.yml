services:
  redis:
    image: redis:6.2-alpine
    restart: always
    expose:
      - 6379
    volumes:
      - ./redis/data:/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/mediafiles:/app/mediafiles
    expose:
      - 8000
    depends_on:
      - redis
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  beat:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    depends_on:
      - redis
      - backend
    command: celery -A core beat
    restart: always

  worker_candle_sources_fetch:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    depends_on:
      - redis
    command: celery -A core worker -Q candle_sources_fetch --autoscale=5,1 --hostname=worker_candle_sources_fetch@%h
    restart: always

  worker_traders_process:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    depends_on:
      - redis
    command: celery -A core worker -Q traders_process --autoscale=5,1 --hostname=worker_traders_process@%h
    restart: always

  worker_traders_reboot:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    depends_on:
      - redis
    command: celery -A core worker -Q traders_reboot --autoscale=1,1 --hostname=worker_traders_reboot@%h
    restart: always

  worker_optimizers_optimize:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    depends_on:
      - redis
    command: celery -A core worker -Q optimizers_optimize --autoscale=1,1 --hostname=worker_optimizers_optimize@%h
    restart: always

  worker:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    depends_on:
      - redis
    command: celery -A core worker --autoscale=5,1 --hostname=worker@%h
    restart: always

  ws_streams:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    depends_on:
      - redis
    command: python manage.py run_ws_streams
    restart: always

  flower:
    image: kletkinvasilii/trader:latest
    env_file:
      - ./.env
    depends_on:
      - redis
    expose:
      - 5555
    command: celery -A core flower --url-prefix=flower --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    restart: always

  nginx:
    build:
      context: nginx/
      dockerfile: Dockerfile
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./backend/staticfiles:/home/app/backend/staticfiles
      - ./backend/mediafiles:/home/app/backend/mediafiles
    depends_on:
      - backend
      - flower

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --email vasiliykletkin@gmail.com -d 5708425-cv02177.twc1.net --agree-tos
