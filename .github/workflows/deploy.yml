name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          command_timeout: 15m
          script: |
            set -e

            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
            WORKERS="worker worker_candle_sources_fetch worker_traders_process worker_traders_reboot worker_optimizers_optimize"
            WORKER_STOP_TIMEOUT=30
            HEALTH_CHECK_RETRIES=60
            HEALTH_CHECK_INTERVAL=10

            cd /home/$REPO_NAME/

            # Pull новые образы
            echo "--- Pulling images ---"
            echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login --username ${{ vars.DOCKERHUB_USERNAME }} --password-stdin
            docker compose pull backend $WORKERS beat flower

            # Остановка beat (прекращаем планирование новых задач)
            echo "--- Stopping beat ---"
            docker compose stop beat

            # Остановка воркеров с grace period на завершение текущих задач
            echo "--- Stopping workers (grace period ${WORKER_STOP_TIMEOUT}s) ---"
            docker compose stop -t $WORKER_STOP_TIMEOUT $WORKERS

            # Миграции и сбор статики
            echo "--- Running migrations & collecting static ---"
            docker compose run --rm -T --entrypoint "" backend bash entrypoint.sh echo "Setup complete"

            # Перезапуск backend
            echo "--- Restarting backend ---"
            docker compose up -d --no-deps --force-recreate --remove-orphans backend

            # Health check
            echo "--- Health check ---"
            START_TIME=$(date +%s)
            for i in $(seq 1 $HEALTH_CHECK_RETRIES); do
              sleep $HEALTH_CHECK_INTERVAL
              if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/')" > /dev/null 2>&1; then
                ELAPSED=$(( $(date +%s) - START_TIME ))
                echo "Health check passed on attempt $i (${ELAPSED}s)"
                break
              fi
              echo "Attempt $i/$HEALTH_CHECK_RETRIES: backend not ready"
              if [ "$i" -eq $HEALTH_CHECK_RETRIES ]; then
                ELAPSED=$(( $(date +%s) - START_TIME ))
                echo "Health check failed after $HEALTH_CHECK_RETRIES attempts (${ELAPSED}s)"
                docker compose logs backend --tail 30
                exit 1
              fi
            done

            # Перезапуск воркеров, затем beat (воркеры должны быть готовы до начала планирования)
            echo "--- Restarting workers ---"
            docker compose up -d --no-deps --force-recreate $WORKERS flower
            echo "--- Restarting beat ---"
            docker compose up -d --no-deps --force-recreate beat

            # Перезагрузка nginx
            echo "--- Reloading nginx ---"
            docker compose exec nginx nginx -s reload || docker compose restart nginx

            # Очистка
            docker image prune -f
