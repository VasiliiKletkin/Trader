name: CD to production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: Build & Push
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -e

            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
            cd /home/$REPO_NAME/

            echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login --username ${{ vars.DOCKERHUB_USERNAME }} --password-stdin

            WORKERS="worker worker_sources_fetch_last_candles_for_exchange_client worker_traders_process_for_exchange_client worker_trader_reboot worker_optimizer_optimize"

            # Pull новые образы (старые контейнеры продолжают работать)
            docker compose pull backend $WORKERS beat flower

            # Миграции на новом образе (старый бэкенд обслуживает запросы)
            docker compose run --rm -T backend python manage.py migrate --noinput
            docker compose run --rm -T backend python manage.py collectstatic --noinput

            # Подменить бэкенд (~1-2с)
            docker compose up -d --no-deps --remove-orphans backend

            # Перезапустить воркеры и beat
            docker compose stop beat
            docker compose up -d --no-deps $WORKERS flower
            docker compose up -d beat

            docker image prune -f

            # # Health check
            # echo "Waiting for backend to start..."
            # sleep 5
            # for i in 1 2 3; do
            #   if curl -sf http://localhost:8000/health/ > /dev/null; then
            #     echo "Health check passed"
            #     break
