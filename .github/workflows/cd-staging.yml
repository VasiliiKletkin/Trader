name: CD to staging

on:
  push:
    branches:
      - staging

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_USERNAME }}
          # key: ${{ secrets.STAGING_SSH_KEY }}
          password: ${{ secrets.STAGING_PASSWORD }}
          script: |
            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
            echo "Project Name: $REPO_NAME"
            cd /home/$REPO_NAME/
            echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login --username ${{ vars.DOCKERHUB_USERNAME }} --password-stdin

            SERVICES="backend beat worker_sources_fetch_last_candles worker_trader_process worker_source_fetch_candles worker_trader_reboot"
            docker-compose pull $SERVICES
            docker-compose up -d --remove-orphans $SERVICES

            sleep 10
            docker-compose restart nginx

            docker image prune -f --filter "until=1h"
            docker container prune -f --filter "until=1h"
            docker builder prune -f --filter "until=1h"