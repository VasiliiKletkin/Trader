name: CD to staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    uses: ./.github/workflows/build.yml
    with:
      image_tag: staging
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
