services:
  celery_worker:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=celery_worker
    command: celery -A core worker --autoscale=5,1 --hostname=celery_worker@%h
    restart: always

  traders_worker:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=traders_worker
    command: celery -A core worker -Q traders --autoscale=1,1 --hostname=traders_worker@%h
    restart: always

  optimizers_worker:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=optimizers_worker
    command: celery -A core worker -Q optimizers --autoscale=1,1 --hostname=optimizers_worker@%h
    restart: always

  candle_sources_worker:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=candle_sources_worker
    command: celery -A core worker -Q candle_sources --concurrency=1 --hostname=candle_sources_worker@%h
    restart: always

  exchange_client_rpc_worker:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=exchange_client_rpc_worker
    command: python manage.py run_exchange_client_rpc_worker
    restart: always

  trader_ws_worker:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=trader_ws_worker
    command: python manage.py run_trader_ws_worker
    restart: always

  candle_source_ws_worker:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=candle_source_ws_worker
    command: python manage.py run_candle_source_ws_worker
    restart: always
