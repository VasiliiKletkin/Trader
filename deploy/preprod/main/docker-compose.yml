services:
  postgres:
    image: postgres:14.18-alpine
    restart: always
    ports:
      - 15432:5432
    volumes:
      - ./postgres/data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DATABASE"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - ./redis/data:/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=backend
    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/mediafiles:/app/mediafiles
    expose:
      - 8000
    depends_on:
      - postgres
      - redis
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  celery_beat:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=celery_beat
    depends_on:
      - postgres
      - redis
      - backend
    command: celery -A core beat
    restart: always

  flower:
    image: kletkinvasilii/trader:staging
    env_file:
      - ./.env
    environment:
      - POSTGRES_APP_NAME=flower
    depends_on:
      - postgres
      - redis
    expose:
      - 5555
    command: celery -A core flower --url-prefix=flower --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    restart: always

  nginx:
    build:
      context: nginx/
      dockerfile: Dockerfile
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./backend/staticfiles:/home/app/backend/staticfiles
      - ./backend/mediafiles:/home/app/backend/mediafiles
    depends_on:
      - backend
      - flower

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --email vasiliykletkin@gmail.com -d 5113131-cv02177.twc1.net --agree-tos
