services:
  postgres:
    image: postgres:14.18-alpine
    restart: always
    ports:
      - 5432:5432
    volumes:
      - ./postgres/data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - ./redis/data:/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    ports:
      - 8000:8000
      - 5678:5678
    depends_on:
      - postgres
      - redis
    entrypoint: bash entrypoint.sh
    command: debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - 5555:5555
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    command: celery -A core flower --url_prefix=flower

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    command: celery -A core beat -l INFO

  worker_sources_fetch_last_candles:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -l INFO -Q sources_fetch_last_candles --autoscale=3,1 --hostname=worker_sources_fetch_last_candles@%h

  worker_sources_fetch_last_candles_for_exchange_client:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -l INFO -Q sources_fetch_last_candles_for_exchange_client --autoscale=3,1 --hostname=worker_sources_fetch_last_candles_for_exchange_client@%h

  worker_traders_process_for_exchange_client:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -l INFO -Q traders_process_for_exchange_client --autoscale=3,1 --hostname=worker_traders_process_for_exchange_client@%h

  worker_source_fetch_candles:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -l INFO -Q source_fetch_candles  --hostname=worker_source_fetch_candles@%h

  worker_trader_reboot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -l INFO -Q trader_reboot --hostname=worker_trader_reboot@%h

  worker_exchange_clients_fetch_balances:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -l INFO -Q exchange_clients_fetch_balances --hostname=worker_exchange_clients_fetch_balances@%h
