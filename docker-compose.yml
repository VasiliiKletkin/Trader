services:
  postgres:
    image: postgres:14.18-alpine
    restart: always
    ports:
      - 5432:5432
    volumes:
      - ./postgres/data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DATABASE"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - ./redis/data:/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    ports:
      - 8000:8000
      - 5678:5678
    depends_on:
      - postgres
      - redis
    entrypoint: bash entrypoint.sh
    command: sh -c "pip install debugpy && python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    command: celery -A core beat
    restart: always

  worker_candle_sources_fetch:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -Q candle_sources_fetch --autoscale=5,1 --hostname=worker_candle_sources_fetch@%h
    restart: always

  worker_traders_process:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -Q traders_process --autoscale=5,1 --hostname=worker_traders_process@%h
    restart: always

  worker_traders_reboot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -Q traders_reboot --hostname=worker_traders_reboot@%h
    restart: always

  worker_optimizers_optimize:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker -Q optimizers_optimize --hostname=worker_optimizers_optimize@%h
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A core worker --hostname=worker@%h
    restart: always

  exchange_client_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    command: python manage.py run_exchange_client_worker
    restart: always

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - 5555:5555
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    command: celery -A core flower --url_prefix=flower
    restart: always
